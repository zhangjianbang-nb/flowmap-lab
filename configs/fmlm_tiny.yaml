algo: fmlm
seed: 0
device: auto

data:
  kind: toy

model:
  arch: auto
  two_time: true

schedule:
  name: linear

train:
  steps: 1500
  batch_size: 256
  lr: 0.002
  weight_decay: 0.01
  ema_decay: 0.999
  log_every: 100
  ckpt_every: 500
  teacher_steps: 800
  teacher_ckpt: null
  full_jump_prob: 0.5

eval:
  n: 512
